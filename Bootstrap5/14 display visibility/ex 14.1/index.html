<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 14.1 Display Visibility</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-5">
        <div class="d-none bg-primary text-white p-3 mb-3">Hidden on all screens</div>
        <div class="d-md-block bg-success text-white p-3 mb-3">Visible on medium and up</div>
        <div class="d-lg-flex bg-warning p-3">Flex on large screens and up</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.js"></script>
</body>

</html>
