<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Exercise 9.2 Button Group</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-5">

        <div class="btn-group">

            <button class="btn btn-primary">Left</button>
            <button class="btn btn-primary">Middle</button>
            <button class="btn btn-primary">Right</button>

        </div>

        <div class="btn-group" role="group">
  
            <input type="checkbox" class="btn-check" id="check1" autocomplete="off">
            <label class="btn btn-outline-primary" for="check1">
                Option 1
            </label>

            <input type="checkbox" class="btn-check" id="check2" autocomplete="off">
            <label class="btn btn-outline-primary" for="check2">
                Option 2
            </label>

            <input type="checkbox" class="btn-check" id="check3" autocomplete="off">
            <label class="btn btn-outline-primary" for="check3">
                Option 3
            </label>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.js"></script>

</body>

</html>
