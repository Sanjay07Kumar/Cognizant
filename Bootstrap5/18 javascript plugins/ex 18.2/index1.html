<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 18.2 Accordion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-5">
        <div class="accordion" id="myAccordian">
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#item1">
                        Section 1
                    </button>
                </h2>
                <div class="accordion-collapse collapse show" data-bs-parent="#myAccordian" id="item1">
                    <div class="accordion-body">Sec 1 content</div>
                </div>
            </div>
        </div>
        <div class="accordion" id="myAccordian">
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#item2">
                        Section 2
                    </button>
                </h2>
                <div class="accordion-collapse collapse" data-bs-parent="#myAccordian" id="item2">
                    <div class="accordion-body">Sec 2 content</div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.js"></script>
</body>

</html>
