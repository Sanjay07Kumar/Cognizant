<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Exercise 5.2 Column Reordering</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

    <div class="container mt-5">

        <div class="row">

            <div class="col-md-6 order-md-2 bg-primary text-white p-5">
                First Column
            </div>

            <div class="col-md-6 order-md-1 bg-success text-white p-5">
                Second Column
            </div>

        </div>

    </div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.js">
    </script>

</body>

</html>
